name: Build Rust Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: minecraft-launcher
        run: npm install

      - name: Build exe
        working-directory: minecraft-launcher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build

      - name: List dist output
        working-directory: minecraft-launcher
        run: dir dist /s /b

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustLauncher-win-x64
          path: minecraft-launcher/dist/
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Rust Launcher v1.0.0
          draft: false
          prerelease: false
          make_latest: true
          files: minecraft-launcher/dist/**
          body: |
            ## Rust Launcher v1.0.0

            **Download:** `Rust Launcher Setup.exe`

            ### Requirements
            - Windows 10 / 11
            - Minecraft Bedrock installed
            - Run as Administrator

            ### Included
            - Rust Launcher UI
            - RustInjector.exe
            - RustDLL.dll (DX12 hook — FPS, keystrokes, in-game menu)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
