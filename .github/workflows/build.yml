name: Build Rust Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: minecraft-launcher
        run: npm install

      - name: Build exe
        working-directory: minecraft-launcher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RustLauncher-win-x64
          path: |
            minecraft-launcher/dist/*.exe
            minecraft-launcher/dist/*.zip
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Rust Launcher v1.0.0
          draft: false
          prerelease: false
          files: |
            minecraft-launcher/dist/*.exe
            minecraft-launcher/dist/*.zip
          body: |
            ## Rust Launcher v1.0.0

            **Download:** `Rust Launcher Setup.exe`

            ### Requirements
            - Windows 10/11
            - Minecraft Bedrock installed
            - Run as Administrator

            ### What's included
            - Rust Launcher (Electron app)
            - RustInjector.exe
            - RustDLL.dll (DX12 hook, FPS, keystrokes, in-game menu)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
